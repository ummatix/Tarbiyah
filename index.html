<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta id="tarbiyah-theme-color" name="theme-color" content="#FCF8FF" />
    <title>TARBIYAH — Islamic Learning & Personal Growth</title>
    <script>
      (function () {
        try {
          var stored = window.localStorage.getItem('tarbiyah_theme');
          var isDark = stored === 'dark';
          var root = document.documentElement;
          root.classList.toggle('dark', isDark);
          root.dataset.theme = isDark ? 'dark' : 'light';
          root.style.colorScheme = isDark ? 'dark' : 'light';
          root.style.backgroundColor = isDark ? '#0D101A' : '#FCF8FF';
          var meta = document.getElementById('tarbiyah-theme-color');
          if (meta) {
            meta.setAttribute('content', isDark ? '#0D101A' : '#FCF8FF');
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-surface text-on-surface antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
